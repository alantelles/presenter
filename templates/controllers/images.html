<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presenter - Imagens</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background: #1e1e1e;
            color: #eee;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 16px;
        }
        #upload-form {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        button {
            cursor: pointer;
        }
        #clear-main {
            margin-bottom: 20px;
        }
        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .gallery-item {
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 4px;
            padding: 4px;
            cursor: pointer;
        }
        .gallery-item:hover {
            border-color: #888;
        }
        .gallery-item img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

<body>
    <input type="hidden" name="basic-auth-token" id="basic-auth-token" value="{{BASIC_AUTH_TOKEN}}">

    <h1>Imagens</h1>

    <form id="upload-form">
        <input type="file" id="file-input" accept="image/*">
        <button type="submit">Enviar</button>
    </form>

    <button id="clear-main">Limpar tela</button>

    <div id="gallery"></div>

    <script type="module" src="/static/js/images/images.js"></script>
</body>

</html>
